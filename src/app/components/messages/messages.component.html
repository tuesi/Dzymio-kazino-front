<div class="chat-container">
    <div class="chat-box">
        <div class="messages-container" id="chat-box">
            <div *ngFor="let message of messageList" class="message-text-container">
                <span class="messages-user-container">
                    <span class="message-avatar-container">
                        <img class="message-avatar" src={{message.avatar}}>
                    </span>
                    <span class="username-text">{{message.username}}</span>
                </span>
                <span>
                    <span class="chat-text">
                        {{message.message}}
                    </span>
                </span>
            </div>
        </div>
    </div>
</div>
